<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sajeel Mods | SIM DATA PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:
      radial-gradient(circle at top,#7f1d1d,#020617 60%),
      linear-gradient(135deg,#000000,#020617);
    color:#e5e7eb;
}
.glass{
    background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:26px;
}
.red-btn{
    background:linear-gradient(135deg,#ef4444,#b91c1c);
}
.red-btn:hover{ filter:brightness(1.1); }

.button-loader{
    width:20px;height:20px;
    border:3px solid rgba(255,255,255,0.3);
    border-top:3px solid #ef4444;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

<!-- LOGIN -->
<div id="loginBox" class="glass max-w-md w-full p-8 shadow-2xl hidden">
    <h1 class="text-3xl font-extrabold text-center mb-1 tracking-wide">
        Sajeel <span class="text-red-500">Mods</span>
    </h1>
    <p class="text-center text-slate-400 mb-8">Contact For Login 03061601587</p>

    <input id="username" placeholder="Username"
        class="w-full mb-4 px-5 py-4 rounded-xl bg-black/50 border border-white/10 outline-none font-semibold">

    <div class="relative">
        <input id="password" type="password" placeholder="Password"
            class="w-full px-5 py-4 rounded-xl bg-black/50 border border-white/10 outline-none font-semibold">
        <i onclick="togglePass()" class="fa fa-eye absolute right-5 top-5 cursor-pointer text-slate-400"></i>
    </div>

    <p id="loginError" class="text-red-400 text-sm mt-4 hidden">Invalid Credentials</p>

    <button onclick="login()" class="mt-6 w-full red-btn py-4 rounded-xl font-extrabold tracking-wide">
        LOGIN
    </button>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden w-full max-w-3xl mx-auto py-10">

<div class="flex justify-between items-center mb-8">
    <h2 class="text-2xl font-extrabold tracking-wide">
        SIM DATA <span class="text-red-500">PRO By Sajeel</span>
    </h2>
    <button onclick="logout()" class="text-sm bg-red-600/80 hover:bg-red-600 px-4 py-2 rounded-lg font-bold">
        Logout
    </button>
</div>

<!-- SEARCH -->
<div class="glass p-6 mb-8 space-y-5">
    <input id="phoneInput" placeholder="03XXXXXXXXX"
        class="w-full px-6 py-5 rounded-2xl bg-black/50 border border-white/10 outline-none font-bold text-lg tracking-wider">

    <button id="searchBtn" onclick="fetchData()"
        class="w-full red-btn py-5 rounded-2xl font-extrabold tracking-widest flex items-center justify-center gap-3">
        <span id="btnText">SEARCH DATABASE</span>
        <div id="btnLoader" class="button-loader hidden"></div>
    </button>
</div>

<!-- RESULT -->
<div id="contentArea" class="hidden glass p-6 space-y-5">
    <div class="text-center border-b border-white/10 pb-4">
        <h3 class="font-extrabold text-lg tracking-wide">SAJEEL DATA REPORT</h3>
        <p id="reportDate" class="text-xs text-slate-400"></p>
    </div>

    <div id="resultsList" class="space-y-4"></div>

    <a href="https://wa.me/923061601587" target="_blank"
       class="block text-center mt-6 text-sm text-slate-400 hover:text-red-400 font-bold">
        CONTACT ON WHATSAPP
    </a>

    <button onclick="takeScreenshot()"
        class="w-full red-btn py-5 rounded-2xl font-extrabold tracking-widest mt-6">
        SAVE SCREENSHOT
    </button>
</div>

<div id="errorState" class="hidden text-center glass p-10">
    <h2 class="text-xl font-bold">No Data Found</h2>
</div>

</div>

<script>
const USER="sajeelxhacker";
const PASS="s4sajeeldb";

/* ONE-TIME LOGIN CHECK */
if(localStorage.getItem("sajeel_logged")==="true"){
    loginBox.classList.add("hidden");
    app.classList.remove("hidden");
}else{
    loginBox.classList.remove("hidden");
}

function togglePass(){
    password.type=password.type==="password"?"text":"password";
}

function login(){
    if(username.value===USER && password.value===PASS){
        localStorage.setItem("sajeel_logged","true");
        loginBox.classList.add("hidden");
        app.classList.remove("hidden");
    }else{
        loginError.classList.remove("hidden");
    }
}

function logout(){
    localStorage.removeItem("sajeel_logged");
    location.reload();
}

async function fetchData(){
    const num=phoneInput.value.trim();
    if(!/^03\d{9}$/.test(num)) return alert("Enter valid number");

    btnText.classList.add("hidden");
    btnLoader.classList.remove("hidden");
    resultsList.innerHTML="";
    contentArea.classList.add("hidden");
    errorState.classList.add("hidden");

    try{
        const res=await fetch(`https://pak-sim-info.ftgmhacks.workers.dev/?num=${num}`);
        const data=await res.json();

        reportDate.innerText=new Date().toLocaleString();

        if(data.success && data.data.data.length){
            data.data.data.forEach(i=>{
                resultsList.innerHTML+=`
                <div class="p-5 rounded-2xl bg-black/40 border border-white/10">
                    <p class="font-extrabold text-red-400 text-lg">${i.Name}</p>
                    <p class="text-sm mt-1">Mobile: ${i.Mobile}</p>
                    <p class="text-sm">CNIC: ${i.CNIC.replace(/^(\d{5})\d+(\d{1})$/,"$1******$2")}</p>
                    <p class="text-xs text-slate-400 mt-2">${i.Address}</p>
                </div>`;
            });
            contentArea.classList.remove("hidden");
        }else{
            errorState.classList.remove("hidden");
        }
    }catch{
        errorState.classList.remove("hidden");
    }finally{
        btnText.classList.remove("hidden");
        btnLoader.classList.add("hidden");
    }
}

function takeScreenshot(){
    html2canvas(contentArea,{scale:2,backgroundColor:"#020617"}).then(c=>{
        const a=document.createElement("a");
        a.href=c.toDataURL();
        a.download="SajeelMods_SIM_DB.png";
        a.click();
    });
}
</script>

</body>
</html>
